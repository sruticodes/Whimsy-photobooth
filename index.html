<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Whimsy Photobooth</title>
  
  <!-- Pixel & Handwritten Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Reenie+Beanie&family=VT323&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Press Start 2P', monospace;
      background-color: #fce4ec;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }

    /* Top Navigation Bar - Centered Grid */
    .header {
      width: 100%;
      height: 60px;
      background: #f7f5f7;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 24px;
      border-bottom: 2px solid #e0e0e0;
      z-index: 10;
    }

    .brand-sub {
      font-family: 'Reenie Beanie', cursive;
      font-size: 28px;
      color: #333;
      justify-self: start;
    }

    .brand-title {
      font-family: 'Press Start 2P', monospace;
      font-size: 20px;
      color: #ff60a8;
      text-shadow: 2px 2px 0px #ffe1ee;
      justify-self: center;
    }

    /* Screen Views */
    .screen {
      display: none;
      width: 100%;
      height: calc(100vh - 60px);
      position: relative;
    }

    .screen.active {
      display: flex;
    }

    /* ---------------- SCREEN 1: TAKE PHOTO ---------------- */
    #screen-1 {
      background-color: #f7b2d1;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    .camera-frame {
      width: 640px;
      height: 420px;
      background-color: #faebeb;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #webcam-feed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* Mirror view */
    }

    .countdown-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.35);
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 96px;
      color: #fff;
      text-shadow: 4px 4px 0 #ff60a8;
      z-index: 5;
    }

    .pixel-btn {
      background: #fce4ec;
      border: 3px solid #000;
      padding: 14px 28px;
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
      color: #000;
      cursor: pointer;
      box-shadow: 4px 4px 0px #000;
      transition: all 0.1s ease;
      text-transform: uppercase;
    }

    .pixel-btn:hover {
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0px #000;
      background: #ffffff;
    }

    .pixel-btn:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0px #000;
    }

    /* ---------------- SCREEN 2: WHIMSYMAXX DECORATION ---------------- */
    #screen-2 {
      background-color: #f7b2d1;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 30px;
    }

    .deco-workspace {
      display: flex;
      gap: 36px;
      align-items: center;
    }

    .editor-container {
      width: 580px;
      height: 380px;
      background-color: #faebeb;
      position: relative;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    #deco-canvas {
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    .sticker-palette {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .palette-title {
      font-size: 14px;
      color: #333;
      letter-spacing: 0.5px;
      text-align: center;
    }

    .sticker-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .sticker-item {
      width: 52px;
      height: 52px;
      background: rgba(255, 255, 255, 0.7);
      border: 2px solid transparent;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      padding: 6px;
    }

    .sticker-item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .sticker-item:hover {
      transform: scale(1.15) rotate(5deg);
      background: #ffffff;
      border-color: #ff60a8;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .deco-controls {
      margin-top: 24px;
      display: flex;
      gap: 20px;
    }

    .whimsy-caption {
      margin-top: 28px;
      font-family: 'Reenie Beanie', cursive;
      font-size: 42px;
      color: #1a1a1a;
      letter-spacing: 1px;
    }

    /* ---------------- SCREEN 3: PHOTO STRIP RESULT ---------------- */
    #screen-3 {
      background-color: #fdf8c5;
      align-items: center;
      justify-content: center;
      gap: 60px;
    }

    .strip-container {
      width: 220px;
      background: #e3f6ed;
      padding: 16px 16px 20px 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      border-radius: 4px;
    }

    .strip-slot {
      width: 100%;
      height: 125px;
      background-color: #d1d1d1;
      border-radius: 2px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .strip-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .strip-footer {
      font-family: 'Reenie Beanie', cursive;
      font-size: 32px;
      color: #222;
      margin-top: 4px;
    }

    .action-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    #export-canvas {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="header">
    <span class="brand-sub">buildwithsruti</span>
    <span class="brand-title">WHIMSY PHOTOBOOTH</span>
  </header>

  <!-- ==================== SCREEN 1: TAKE PHOTO ==================== -->
  <section id="screen-1" class="screen active">
    <div class="camera-frame">
      <video id="webcam-feed" autoplay playsinline muted></video>
      <div id="countdown" class="countdown-overlay">3</div>
    </div>
    <button class="pixel-btn" id="btn-take-photo">TAKE A PHOTO</button>
  </section>

  <!-- ==================== SCREEN 2: DECORATE ==================== -->
  <section id="screen-2" class="screen">
    <div class="deco-workspace">
      <!-- Interactive Editor Canvas -->
      <div class="editor-container">
        <canvas id="deco-canvas" width="580" height="380"></canvas>
      </div>

      <!-- Sticker Palette -->
      <div class="sticker-palette">
        <div class="palette-title">PICK YOUR<br/>STICKERS</div>
        <div class="sticker-grid">
          <div class="sticker-item" data-sticker="purple-gem">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='30,10 70,10 90,35 50,90 10,35' fill='%23d8b4fe' stroke='%23a855f7' stroke-width='4'/><polygon points='30,10 50,35 70,10' fill='%23e9d5ff'/><polygon points='10,35 50,35 30,10' fill='%23c084fc'/><polygon points='70,10 50,35 90,35' fill='%23a855f7'/><polygon points='10,35 50,35 50,90' fill='%239333ea'/><polygon points='90,35 50,35 50,90' fill='%237e22ce'/></svg>" alt="Purple Gem" />
          </div>
          <div class="sticker-item" data-sticker="yellow-gem">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='30,10 70,10 90,35 50,90 10,35' fill='%23fef08a' stroke='%23eab308' stroke-width='4'/><polygon points='30,10 50,35 70,10' fill='%23fef9c3'/><polygon points='10,35 50,35 30,10' fill='%23fde047'/><polygon points='70,10 50,35 90,35' fill='%23eab308'/><polygon points='10,35 50,35 50,90' fill='%23ca8a04'/><polygon points='90,35 50,35 50,90' fill='%23a16207'/></svg>" alt="Yellow Gem" />
          </div>
          <div class="sticker-item" data-sticker="heart-gem">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50,88 C50,88 12,60 12,32 C12,16 24,8 36,8 C44,8 48,14 50,18 C52,14 56,8 64,8 C76,8 88,16 88,32 C88,60 50,88 50,88 Z' fill='%23f43f5e' stroke='%23be123c' stroke-width='4'/><path d='M50,18 C44,8 36,8 24,12 C16,20 16,32 30,50 L50,88 Z' fill='%23fb7185'/><circle cx='32' cy='22' r='6' fill='%23ffffff' opacity='0.7'/></svg>" alt="Heart Gem" />
          </div>
          <div class="sticker-item" data-sticker="green-gem">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='30,10 70,10 90,35 50,90 10,35' fill='%2386efac' stroke='%2322c55e' stroke-width='4'/><polygon points='30,10 50,35 70,10' fill='%23bbf7d0'/><polygon points='10,35 50,35 30,10' fill='%234ade80'/><polygon points='70,10 50,35 90,35' fill='%2322c55e'/><polygon points='10,35 50,35 50,90' fill='%2316a34a'/><polygon points='90,35 50,35 50,90' fill='%2315803d'/></svg>" alt="Green Gem" />
          </div>
          <div class="sticker-item" data-sticker="blue-gem">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='30,10 70,10 90,35 50,90 10,35' fill='%237dd3fc' stroke='%230284c7' stroke-width='4'/><polygon points='30,10 50,35 70,10' fill='%23bae6fd'/><polygon points='10,35 50,35 30,10' fill='%2338bdf8'/><polygon points='70,10 50,35 90,35' fill='%230284c7'/><polygon points='10,35 50,35 50,90' fill='%230369a1'/><polygon points='90,35 50,35 50,90' fill='%23075985'/></svg>" alt="Blue Gem" />
          </div>
          <div class="sticker-item" data-sticker="pink-gem">
            <img src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='30,10 70,10 90,35 50,90 10,35' fill='%23f472b6' stroke='%23db2777' stroke-width='4'/><polygon points='30,10 50,35 70,10' fill='%23fbcfe8'/><polygon points='10,35 50,35 30,10' fill='%23f472b6'/><polygon points='70,10 50,35 90,35' fill='%23db2777'/><polygon points='10,35 50,35 50,90' fill='%23be185d'/><polygon points='90,35 50,35 50,90' fill='%239d174d'/></svg>" alt="Pink Gem" />
          </div>
        </div>
      </div>
    </div>

    <div class="deco-controls">
      <button class="pixel-btn" id="btn-add-to-strip">ADD TO STRIP</button>
      <button class="pixel-btn" id="btn-clear-canvas">CLEAR</button>
    </div>

    <p class="whimsy-caption">Drag stickers on to your face and whimsymaxx</p>
  </section>

  <!-- ==================== SCREEN 3: DOWNLOAD ==================== -->
  <section id="screen-3" class="screen">
    <div class="strip-container" id="strip-preview">
      <div class="strip-slot" id="slot-0"></div>
      <div class="strip-slot" id="slot-1"></div>
      <div class="strip-slot" id="slot-2"></div>
      <div class="strip-footer">WHIMSY</div>
    </div>

    <div class="action-panel">
      <button class="pixel-btn" id="btn-download-strip">DOWNLOAD STRIP</button>
      <button class="pixel-btn" id="btn-take-another">TAKE ANOTHER</button>
    </div>
  </section>

  <canvas id="export-canvas"></canvas>

  <script>
    // --- Embedded Vector Assets for Canvas ---
    const stickerDataURIs = {
      'purple-gem': "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='30,10 70,10 90,35 50,90 10,35' fill='%23d8b4fe' stroke='%23a855f7' stroke-width='4'/><polygon points='30,10 50,35 70,10' fill='%23e9d5ff'/><polygon points='10,35 50,35 30,10' fill='%23c084fc'/><polygon points='70,10 50,35 90,35' fill='%23a855f7'/><polygon points='10,35 50,35 50,90' fill='%239333ea'/><polygon points='90,35 50,35 50,90' fill='%237e22ce'/></svg>",
      'yellow-gem': "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='30,10 70,10 90,35 50,90 10,35' fill='%23fef08a' stroke='%23eab308' stroke-width='4'/><polygon points='30,10 50,35 70,10' fill='%23fef9c3'/><polygon points='10,35 50,35 30,10' fill='%23fde047'/><polygon points='70,10 50,35 90,35' fill='%23eab308'/><polygon points='10,35 50,35 50,90' fill='%23ca8a04'/><polygon points='90,35 50,35 50,90' fill='%23a16207'/></svg>",
      'heart-gem': "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><path d='M50,88 C50,88 12,60 12,32 C12,16 24,8 36,8 C44,8 48,14 50,18 C52,14 56,8 64,8 C76,8 88,16 88,32 C88,60 50,88 50,88 Z' fill='%23f43f5e' stroke='%23be123c' stroke-width='4'/><path d='M50,18 C44,8 36,8 24,12 C16,20 16,32 30,50 L50,88 Z' fill='%23fb7185'/><circle cx='32' cy='22' r='6' fill='%23ffffff' opacity='0.7'/></svg>",
      'green-gem': "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='30,10 70,10 90,35 50,90 10,35' fill='%2386efac' stroke='%2322c55e' stroke-width='4'/><polygon points='30,10 50,35 70,10' fill='%23bbf7d0'/><polygon points='10,35 50,35 30,10' fill='%234ade80'/><polygon points='70,10 50,35 90,35' fill='%2322c55e'/><polygon points='10,35 50,35 50,90' fill='%2316a34a'/><polygon points='90,35 50,35 50,90' fill='%2315803d'/></svg>",
      'blue-gem': "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='30,10 70,10 90,35 50,90 10,35' fill='%237dd3fc' stroke='%230284c7' stroke-width='4'/><polygon points='30,10 50,35 70,10' fill='%23bae6fd'/><polygon points='10,35 50,35 30,10' fill='%2338bdf8'/><polygon points='70,10 50,35 90,35' fill='%230284c7'/><polygon points='10,35 50,35 50,90' fill='%230369a1'/><polygon points='90,35 50,35 50,90' fill='%23075985'/></svg>",
      'pink-gem': "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='30,10 70,10 90,35 50,90 10,35' fill='%23f472b6' stroke='%23db2777' stroke-width='4'/><polygon points='30,10 50,35 70,10' fill='%23fbcfe8'/><polygon points='10,35 50,35 30,10' fill='%23f472b6'/><polygon points='70,10 50,35 90,35' fill='%23db2777'/><polygon points='10,35 50,35 50,90' fill='%23be185d'/><polygon points='90,35 50,35 50,90' fill='%239d174d'/></svg>"
    };

    const preloadedImages = {};
    Object.keys(stickerDataURIs).forEach(key => {
      const img = new Image();
      img.src = stickerDataURIs[key];
      preloadedImages[key] = img;
    });

    // --- Application State ---
    const capturedPhotos = [];
    let currentPhotoData = null;
    let activeStickers = [];
    let selectedStickerIndex = null;
    let draggedStickerIndex = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    // --- DOM Elements ---
    const screens = {
      1: document.getElementById('screen-1'),
      2: document.getElementById('screen-2'),
      3: document.getElementById('screen-3')
    };

    const webcamFeed = document.getElementById('webcam-feed');
    const countdownEl = document.getElementById('countdown');
    const btnTakePhoto = document.getElementById('btn-take-photo');

    const decoCanvas = document.getElementById('deco-canvas');
    const decoCtx = decoCanvas.getContext('2d');
    const btnAddToStrip = document.getElementById('btn-add-to-strip');
    const btnClearCanvas = document.getElementById('btn-clear-canvas');

    const btnDownloadStrip = document.getElementById('btn-download-strip');
    const btnTakeAnother = document.getElementById('btn-take-another');

    function showScreen(screenNum) {
      Object.values(screens).forEach(s => s.classList.remove('active'));
      screens[screenNum].classList.add('active');
    }

    // --- 1. Webcam Setup ---
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 1280, height: 720, facingMode: 'user' },
          audio: false
        });
        webcamFeed.srcObject = stream;
      } catch (err) {
        alert('Camera access is required for Whimsy Photobooth.');
        console.error('Camera initialization error:', err);
      }
    }

    btnTakePhoto.addEventListener('click', () => {
      let count = 3;
      countdownEl.textContent = count;
      countdownEl.style.display = 'flex';
      btnTakePhoto.disabled = true;

      const timer = setInterval(() => {
        count--;
        if (count > 0) {
          countdownEl.textContent = count;
        } else {
          clearInterval(timer);
          countdownEl.style.display = 'none';
          btnTakePhoto.disabled = false;
          captureSnapshot();
        }
      }, 800);
    });

    function captureSnapshot() {
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = 580;
      tempCanvas.height = 380;
      const ctx = tempCanvas.getContext('2d');

      ctx.translate(580, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(webcamFeed, 0, 0, 580, 380);

      currentPhotoData = tempCanvas.toDataURL('image/png');
      activeStickers = [];
      selectedStickerIndex = null;
      renderDecoCanvas();
      showScreen(2);
    }

    // --- 2. Interactive Canvas Editor with Scaling & Controls ---
    function renderDecoCanvas() {
      if (!currentPhotoData) return;

      const img = new Image();
      img.onload = () => {
        decoCtx.clearRect(0, 0, decoCanvas.width, decoCanvas.height);
        decoCtx.drawImage(img, 0, 0, decoCanvas.width, decoCanvas.height);

        activeStickers.forEach((sticker, index) => {
          decoCtx.save();
          decoCtx.translate(sticker.x, sticker.y);
          decoCtx.rotate((sticker.rotation || 0) * Math.PI / 180);

          // Draw Image Asset
          const imgAsset = preloadedImages[sticker.id];
          if (imgAsset) {
            decoCtx.drawImage(imgAsset, -sticker.size / 2, -sticker.size / 2, sticker.size, sticker.size);
          }

          // Draw Selection & Interactive Controls
          if (index === selectedStickerIndex) {
            const boxSize = sticker.size + 12;
            
            // Dashed Selection Box
            decoCtx.strokeStyle = '#ff60a8';
            decoCtx.lineWidth = 2;
            decoCtx.setLineDash([4, 4]);
            decoCtx.strokeRect(-boxSize / 2, -boxSize / 2, boxSize, boxSize);
            decoCtx.setLineDash([]);

            // Corner Controls (+ / - / ↻ / ✕)
            drawControlButton(boxSize / 2, -boxSize / 2, '✕', '#ff4d4d'); // Top-Right: Delete
            drawControlButton(boxSize / 2, boxSize / 2, '+', '#4caf50');  // Bottom-Right: Grow
            drawControlButton(-boxSize / 2, boxSize / 2, '−', '#2196f3'); // Bottom-Left: Shrink
            drawControlButton(-boxSize / 2, -boxSize / 2, '↻', '#ff9800'); // Top-Left: Rotate
          }

          decoCtx.restore();
        });
      };
      img.src = currentPhotoData;
    }

    function drawControlButton(x, y, symbol, color) {
      decoCtx.beginPath();
      decoCtx.arc(x, y, 10, 0, 2 * Math.PI);
      decoCtx.fillStyle = color;
      decoCtx.fill();
      decoCtx.strokeStyle = '#ffffff';
      decoCtx.lineWidth = 1.5;
      decoCtx.stroke();

      decoCtx.fillStyle = '#ffffff';
      decoCtx.font = '10px sans-serif';
      decoCtx.textAlign = 'center';
      decoCtx.textBaseline = 'middle';
      decoCtx.fillText(symbol, x, y);
    }

    // Add Sticker from Palette
    document.querySelectorAll('.sticker-item').forEach(item => {
      item.addEventListener('click', () => {
        const stickerId = item.getAttribute('data-sticker');
        const newSticker = {
          id: stickerId,
          x: 290 + (Math.random() * 40 - 20),
          y: 190 + (Math.random() * 40 - 20),
          size: 52,
          rotation: 0
        };
        activeStickers.push(newSticker);
        selectedStickerIndex = activeStickers.length - 1;
        renderDecoCanvas();
      });
    });

    function getCanvasCoordinates(e) {
      const rect = decoCanvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function onPointerDown(e) {
      const { x, y } = getCanvasCoordinates(e);

      // Check Controls on Selected Sticker
      if (selectedStickerIndex !== null) {
        const s = activeStickers[selectedStickerIndex];
        const boxSize = s.size + 12;

        const dx = x - s.x;
        const dy = y - s.y;
        const rad = -(s.rotation || 0) * Math.PI / 180;
        const rx = dx * Math.cos(rad) - dy * Math.sin(rad);
        const ry = dx * Math.sin(rad) + dy * Math.cos(rad);

        // Delete (Top-Right)
        if (Math.hypot(rx - boxSize/2, ry + boxSize/2) < 14) {
          activeStickers.splice(selectedStickerIndex, 1);
          selectedStickerIndex = null;
          renderDecoCanvas();
          return;
        }
        // Grow (Bottom-Right)
        if (Math.hypot(rx - boxSize/2, ry - boxSize/2) < 14) {
          s.size = Math.min(s.size + 8, 140);
          renderDecoCanvas();
          return;
        }
        // Shrink (Bottom-Left)
        if (Math.hypot(rx + boxSize/2, ry - boxSize/2) < 14) {
          s.size = Math.max(s.size - 8, 20);
          renderDecoCanvas();
          return;
        }
        // Rotate (Top-Left)
        if (Math.hypot(rx + boxSize/2, ry + boxSize/2) < 14) {
          s.rotation = ((s.rotation || 0) + 15) % 360;
          renderDecoCanvas();
          return;
        }
      }

      // Check Click/Drag Hit
      let hitFound = false;
      for (let i = activeStickers.length - 1; i >= 0; i--) {
        const s = activeStickers[i];
        if (Math.hypot(s.x - x, s.y - y) < s.size / 1.4) {
          selectedStickerIndex = i;
          draggedStickerIndex = i;
          dragOffsetX = x - s.x;
          dragOffsetY = y - s.y;
          hitFound = true;
          break;
        }
      }

      if (!hitFound) {
        selectedStickerIndex = null;
      }

      renderDecoCanvas();
    }

    function onPointerMove(e) {
      if (draggedStickerIndex === null) return;
      const { x, y } = getCanvasCoordinates(e);
      activeStickers[draggedStickerIndex].x = x - dragOffsetX;
      activeStickers[draggedStickerIndex].y = y - dragOffsetY;
      renderDecoCanvas();
    }

    function onPointerUp() {
      draggedStickerIndex = null;
    }

    decoCanvas.addEventListener('mousedown', onPointerDown);
    decoCanvas.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    decoCanvas.addEventListener('touchstart', onPointerDown);
    decoCanvas.addEventListener('touchmove', onPointerMove);
    window.addEventListener('touchend', onPointerUp);

    btnClearCanvas.addEventListener('click', () => {
      activeStickers = [];
      selectedStickerIndex = null;
      renderDecoCanvas();
    });

    btnAddToStrip.addEventListener('click', () => {
      selectedStickerIndex = null;
      renderDecoCanvas();

      setTimeout(() => {
        const decoratedImageData = decoCanvas.toDataURL('image/png');
        capturedPhotos.push(decoratedImageData);

        const currentSlotIndex = capturedPhotos.length - 1;
        const slotEl = document.getElementById(`slot-${currentSlotIndex}`);
        slotEl.innerHTML = `<img src="${decoratedImageData}" alt="Strip Photo ${currentSlotIndex + 1}" />`;

        if (capturedPhotos.length < 3) {
          showScreen(1);
        } else {
          showScreen(3);
        }
      }, 50);
    });

    // --- 3. Photostrip Generation & Download ---
    btnDownloadStrip.addEventListener('click', () => {
      const exportCanvas = document.getElementById('export-canvas');
      const ctx = exportCanvas.getContext('2d');

      const stripWidth = 440;
      const stripHeight = 860;
      exportCanvas.width = stripWidth;
      exportCanvas.height = stripHeight;

      ctx.fillStyle = '#e3f6ed';
      ctx.fillRect(0, 0, stripWidth, stripHeight);

      const padding = 32;
      const photoWidth = stripWidth - (padding * 2);
      const photoHeight = 220;
      let loadedImages = 0;

      capturedPhotos.forEach((dataUrl, index) => {
        const img = new Image();
        img.onload = () => {
          const posY = padding + index * (photoHeight + 16);
          ctx.drawImage(img, padding, posY, photoWidth, photoHeight);
          loadedImages++;

          if (loadedImages === capturedPhotos.length) {
            ctx.fillStyle = '#222222';
            ctx.font = '64px "Reenie Beanie", cursive';
            ctx.textAlign = 'center';
            ctx.fillText('WHIMSY', stripWidth / 2, stripHeight - 40);

            const link = document.createElement('a');
            link.download = 'whimsy-photostrip.png';
            link.href = exportCanvas.toDataURL('image/png');
            link.click();
          }
        };
        img.src = dataUrl;
      });
    });

    btnTakeAnother.addEventListener('click', () => {
      capturedPhotos.length = 0;
      for (let i = 0; i < 3; i++) {
        document.getElementById(`slot-${i}`).innerHTML = '';
      }
      showScreen(1);
    });

    window.addEventListener('DOMContentLoaded', initCamera);
  </script>
</body>
</html>
